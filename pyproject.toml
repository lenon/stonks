[project]
name = "stonks"
version = "0.0.0"
requires-python = "==3.13.5"
dependencies = [
  "pandas==3.1.1",
  "xlwings==0.37.11",
  "pandera==0.36.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
  "pandera[mypy]==0.36.0",
  "vcrpy==9.4.2",
  "ruff==0.17.6",
  "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--capture=tee-sys", # capture sys.stdout/stderr and live print to the console
  "--tb=short", # use a shorter traceback format
  "--import-mode=importlib" # recommended by pytest for new projects
]

[tool.coverage.run]
branch = true
source = ["stonks"]
omit = ["tests/*"]
dynamic_context = "test_function"

[tool.coverage.html]
show_contexts = true

[tool.mypy]
strict = true
